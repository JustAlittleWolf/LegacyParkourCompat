import legacyparkourcompat.minecraft.DecompileMinecraftTask

tasks.register('decompileMinecraft', DecompileMinecraftTask) {
    group = 'minecraft'
    description = 'Decompile Minecraft client sources into decompiled_minecraft/<version>. ' +
            'Defaults to latest, 1.8.9, 1.12.2, and 1.14.4. ' +
            'Pass --versions=1.16.5,1.20.1 or -Pversions=1.8 to decompile other major versions. ' +
            'Uses official Mojang mappings when they exist.'

    versions.convention(
            providers.gradleProperty('versions')
                    .orElse(providers.gradleProperty('minecraftVersions'))
                    .map { value -> DecompileMinecraftTask.splitVersions(value) }
                    .orElse(['latest', '1.8.9', '1.12.2', '1.14.4'])
    )
    outputRoot.convention(layout.projectDirectory.dir('decompiled_minecraft'))
    cacheDirectory.convention(layout.buildDirectory.dir('minecraft-decompile-cache'))
}
