import legacyparkourcompat.minecraft.DecompileMinecraftTask
import legacyparkourcompat.minecraft.MinecraftDecompileMain
import java.io.IOException
import java.net.InetSocketAddress
import java.net.Socket
import java.util.HashMap
import java.util.Locale
import java.util.UUID

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "+" + project.minecraft_version
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'ViaVersion'
        url = 'https://repo.viaversion.com'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

configurations {
    decompileRuntime
}

sourceSets {
    server
    tasClient {
        java {
            srcDir 'tas-client/src/common/java'
            srcDir 'tas-client/src/fabric/java'
            srcDir 'tas-client/src/mixins/fabric17/java'
            srcDir 'tas-client/src/mixins/fabric21/java'
            srcDir 'tas-client/core/src/main/java'
        }
        resources {
            srcDir 'tas-client/src/common/resources'
            srcDir 'tas-client/src/fabric/resources'
            srcDir 'tas-client/src/mixins/fabric21/resources'
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "legacyparkourcompat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            sourceSet sourceSets.server
        }
        "legacyparkourrecording" {
            sourceSet sourceSets.tasClient
        }
    }

    runs {
        server {
            source sourceSets.server
        }
        currentTasClient {
            client()
            source sourceSets.tasClient
            ideConfigGenerated = false
        }
    }
}

sourceSets {
    server {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    tasClient {
        // The newest TAS client also needs the project mod itself so compare
        // runs can select and exercise a historical movement profile.
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.viaversion:viaversion-api:${project.viaversion_api_version}"
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"

    decompileRuntime libs.vineflower
    decompileRuntime libs.tiny.remapper
    decompileRuntime libs.mapping.io
    decompileRuntime libs.gson
    decompileRuntime libs.asm
    decompileRuntime libs.asm.commons
    decompileRuntime libs.asm.tree
    decompileRuntime libs.asm.util
    decompileRuntime files("${rootDir}/buildSrc/build/libs/buildSrc.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def tasClientBuild = gradle.includedBuilds.find { it.name == 'tas-client' }

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('test').configure {
    if (tasClientBuild != null) {
        dependsOn tasClientBuild.task(':core:test')
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from sourceSets.server.output
    dependsOn processServerResources
}

tasks.named('sourcesJar', org.gradle.jvm.tasks.Jar) {
    from sourceSets.server.allSource
}

def tasClientVersion = providers.gradleProperty('clientVersion').orElse('1.16.5')
def tasClientVersionId = tasClientVersion.get().replace('-forge', '').replace('-fabric', '')
def tasClientIsCurrent = tasClientVersionId.equalsIgnoreCase('current') || tasClientVersionId == project.minecraft_version
def tasClientVersionFile = rootProject.file('tas-client/client-version.txt')
tasClientVersionFile.parentFile.mkdirs()
tasClientVersionFile.text = tasClientVersion.get() + '\n'

def rootTasAutomationValue = { String propertyName, String environmentName ->
    def propertyValue = findProperty(propertyName)
    if (propertyValue != null && !propertyValue.toString().trim().isEmpty()) {
        return propertyValue.toString().trim()
    }
    def environmentValue = System.getenv(environmentName)
    return environmentValue == null || environmentValue.trim().isEmpty() ? null : environmentValue.trim()
}
def rootTasAutomationArgs = []
def tasCompareTaskRequested = gradle.startParameter.taskNames.any { it.endsWith('runTasCompare') }
def rootTasAutomationExpected = rootTasAutomationValue('tasExpected', 'LEGACY_PARKOUR_TAS_EXPECTED')
def rootTasAutomationRecording = rootTasAutomationValue('tasRecording', 'LEGACY_PARKOUR_TAS_RECORDING')
def rootTasAutomationOutput = rootTasAutomationValue('tasOutput', 'LEGACY_PARKOUR_TAS_OUTPUT')
def rootTasAutomationServer = rootTasAutomationValue('tasServer', 'LEGACY_PARKOUR_TAS_SERVER')
def rootTasAutomationRun = rootTasAutomationValue('tasRun', 'LEGACY_PARKOUR_TAS_RUN')
def rootTasAutomationVersion = rootTasAutomationValue('tasVersion', 'LEGACY_PARKOUR_TAS_VERSION')
def rootTasAutomationCompare = rootTasAutomationValue('tasCompare', 'LEGACY_PARKOUR_TAS_COMPARE')
def rootTasAutomationTolerance = rootTasAutomationValue('tasTolerance', 'LEGACY_PARKOUR_TAS_TOLERANCE')
if (tasCompareTaskRequested) {
    if (rootTasAutomationExpected == null) {
        throw new GradleException('runTasCompare needs -PtasExpected=<version-reference.lprc>')
    }
    if (rootTasAutomationVersion == null) {
        throw new GradleException('runTasCompare needs -PtasVersion=<parkour-version>, for example 1.12')
    }
    if (rootTasAutomationCompare == null || !['true', '1', 'yes'].contains(rootTasAutomationCompare.toLowerCase(Locale.ROOT))) {
        throw new GradleException('runTasCompare needs -PtasCompare=true')
    }
    if (rootTasAutomationTolerance != null) {
        try {
            double tolerance = Double.parseDouble(rootTasAutomationTolerance)
            if (Double.isNaN(tolerance) || Double.isInfinite(tolerance) || tolerance < 0.0D) {
                throw new NumberFormatException('not finite and non-negative')
            }
        } catch (NumberFormatException exception) {
            throw new GradleException("Invalid -PtasTolerance=${rootTasAutomationTolerance}; expected a finite non-negative number", exception)
        }
    }

    File expectedReference = file(rootTasAutomationExpected)
    String runToken = UUID.randomUUID().toString().replace('-', '').substring(0, 10)
    String safeVersion = rootTasAutomationVersion.replaceAll('[^A-Za-z0-9._-]', '_')
    String expectedStem = expectedReference.name.replaceFirst(/(?i)\.lprc$/, '')
    rootTasAutomationRecording = expectedReference.absolutePath
    if (rootTasAutomationOutput == null) {
        rootTasAutomationOutput = new File(expectedReference.parentFile,
            "${expectedStem}-actual-${safeVersion}-${runToken}.lprc").path
    }
    if (rootTasAutomationRun == null) {
        rootTasAutomationRun = "compare-${safeVersion}-${runToken}"
    }
    rootTasAutomationRun = rootTasAutomationRun.replaceAll('[^A-Za-z0-9._:+/@-]', '_')
    if (rootTasAutomationRun.isEmpty()) {
        rootTasAutomationRun = "compare-${runToken}"
    }
    if (rootTasAutomationRun.length() > 36) {
        rootTasAutomationRun = rootTasAutomationRun.substring(0, 36)
    }
}
if (rootTasAutomationRecording != null) {
    rootTasAutomationArgs << "-Dlegacyparkour.tas.recording=${file(rootTasAutomationRecording).absolutePath}"
    rootTasAutomationArgs << '-Dlegacyparkour.tas.autoplay=true'
    rootTasAutomationArgs << '-Dlegacyparkour.tas.autojoin=true'
    rootTasAutomationArgs << '-Dlegacyparkour.tas.mute=true'
    rootTasAutomationArgs << '-Dlegacyparkour.tas.exit=true'
}
if (rootTasAutomationOutput != null) {
    rootTasAutomationArgs << "-Dlegacyparkour.tas.output=${file(rootTasAutomationOutput).absolutePath}"
}
if (rootTasAutomationServer != null) {
    rootTasAutomationArgs << "-Dlegacyparkour.tas.server=${rootTasAutomationServer}"
}
if (rootTasAutomationRun != null) {
    rootTasAutomationArgs << "-Dlegacyparkour.tas.run=${rootTasAutomationRun}"
}
if (rootTasAutomationVersion != null) {
    rootTasAutomationArgs << "-Dlegacyparkour.tas.version=${rootTasAutomationVersion}"
}
if (rootTasAutomationCompare != null) {
    rootTasAutomationArgs << "-Dlegacyparkour.tas.compare=${rootTasAutomationCompare}"
}
if (rootTasAutomationTolerance != null) {
    rootTasAutomationArgs << "-Dlegacyparkour.tas.tolerance=${rootTasAutomationTolerance}"
}
tasks.named('runCurrentTasClient').configure {
    doFirst {
        File optionsFile = file('run/options.txt')
        optionsFile.parentFile.mkdirs()
        List<String> lines = optionsFile.isFile() ? optionsFile.readLines('UTF-8') : []
        Map<String, String> disabled = [narrator: '0', narratorHotkey: 'false', onboardAccessibility: 'false']
        boolean changed = false
        disabled.each { key, value ->
            String setting = "${key}:${value}"
            int index = lines.findIndexOf { it.startsWith("${key}:") }
            if (index < 0) {
                lines.add(setting)
                changed = true
            } else if (lines[index] != setting) {
                lines[index] = setting
                changed = true
            }
        }
        if (changed) optionsFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
    if (tasCompareTaskRequested) {
        doFirst {
            File expectedReference = file(rootTasAutomationExpected)
            if (!expectedReference.isFile()) {
                throw new GradleException("Expected TAS reference does not exist: ${expectedReference}")
            }
            File actualOutput = file(rootTasAutomationOutput)
            if (expectedReference.canonicalFile == actualOutput.canonicalFile) {
                throw new GradleException('TAS compare output must be separate from -PtasExpected')
            }
            if (actualOutput.exists()) {
                throw new GradleException("TAS compare output already exists; choose a fresh path to avoid comparing stale data: ${actualOutput}")
            }
        }
    }
    if (!rootTasAutomationArgs.isEmpty()) {
        jvmArgs rootTasAutomationArgs
    }
}

tasks.named('processTasClientResources', ProcessResources) {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}

tasks.register('runTasClient') {
    group = 'minecraft'
    description = 'Launch a TAS client. Pass an exact -PclientVersion such as 1.8.9, 1.16.5, 1.21.9, or current.'
    if (tasClientIsCurrent) {
        dependsOn 'runCurrentTasClient'
    } else if (tasClientBuild != null) {
        dependsOn tasClientBuild.task(':runTasClient')
    } else {
        doFirst {
            throw new GradleException("TAS client included build is unavailable during IDE sync. Run ./gradlew runTasClient from the command line.")
        }
    }
}

tasks.register('runTasCompare') {
    group = 'minecraft'
    description = 'Compare a reference against Legacy Parkour emulation and fail on any positional difference.'
    dependsOn 'runCurrentTasClient'
    doLast {
        File expectedFile = file(rootTasAutomationExpected)
        File actualFile = file(rootTasAutomationOutput)
        String runId = rootTasAutomationRun
        String version = rootTasAutomationVersion
        double tolerance = rootTasAutomationTolerance == null ? 0.0D : Double.parseDouble(rootTasAutomationTolerance)
        File snapshotLog = file('parkourgym-server/run/logs/latest.log')

        def snapshotContext = {
            String logPath = snapshotLog.absolutePath
            if (snapshotLog.isFile()) {
                int matchingLineNumber = -1
                snapshotLog.eachLine('UTF-8') { line, lineNumber ->
                    if (line.contains('[LPC_FAILURE_SNAPSHOT]') && line.contains('"runId":"' + runId + '"')) {
                        matchingLineNumber = lineNumber
                    }
                }
                if (matchingLineNumber >= 0) {
                    return "Snapshot: ${logPath}:${matchingLineNumber} [LPC_FAILURE_SNAPSHOT] runId=${runId}"
                }
            }
            return "Snapshot log: ${logPath}; search for [LPC_FAILURE_SNAPSHOT] and runId=${runId}"
        }
        def readPositions = { File source, String label ->
            if (!source.isFile() || source.length() == 0L) {
                throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording is missing or empty: ${source.absolutePath}; ${snapshotContext()}")
            }
            java.io.DataInputStream data = null
            try {
                data = new java.io.DataInputStream(new java.io.BufferedInputStream(new java.io.FileInputStream(source)))
                if (data.readInt() != 0x4C505243) {
                    throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording has invalid LPRC magic: ${source.absolutePath}; ${snapshotContext()}")
                }
                int formatVersion = data.readUnsignedShort()
                if (formatVersion != 1) {
                    throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording format ${formatVersion} is unsupported: ${source.absolutePath}; ${snapshotContext()}")
                }
                data.readUnsignedShort()
                double startX = data.readDouble()
                double startY = data.readDouble()
                double startZ = data.readDouble()
                data.readFloat()
                data.readFloat()
                int count = data.readInt()
                if (count < 0 || source.length() != 44L + (34L * count)) {
                    throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording has an invalid tick count or truncated data: ${source.absolutePath}; ${snapshotContext()}")
                }
                List<List<Double>> positions = new ArrayList<List<Double>>(count)
                for (int tick = 0; tick < count; tick++) {
                    data.readUnsignedShort()
                    data.readFloat()
                    data.readFloat()
                    positions.add([Double.valueOf(data.readDouble()), Double.valueOf(data.readDouble()), Double.valueOf(data.readDouble())])
                }
                return [start: [Double.valueOf(startX), Double.valueOf(startY), Double.valueOf(startZ)], ticks: positions]
            } catch (java.io.IOException exception) {
                throw new GradleException("TAS comparison failed for runId=${runId}: could not read ${label} recording ${source.absolutePath}: ${exception.message}; ${snapshotContext()}", exception)
            } finally {
                if (data != null) {
                    data.close()
                }
            }
        }

        def expected = readPositions(expectedFile, 'expected')
        def actual = readPositions(actualFile, 'actual')
        int expectedCount = expected.ticks.size()
        int actualCount = actual.ticks.size()
        int sharedCount = Math.min(expectedCount, actualCount)
        for (int tick = 0; tick < sharedCount; tick++) {
            List<Double> expectedPosition = expected.ticks[tick]
            List<Double> actualPosition = actual.ticks[tick]
            boolean expectedIsFinite = !Double.isNaN(expectedPosition[0]) && !Double.isInfinite(expectedPosition[0])
                && !Double.isNaN(expectedPosition[1]) && !Double.isInfinite(expectedPosition[1])
                && !Double.isNaN(expectedPosition[2]) && !Double.isInfinite(expectedPosition[2])
            boolean actualIsFinite = !Double.isNaN(actualPosition[0]) && !Double.isInfinite(actualPosition[0])
                && !Double.isNaN(actualPosition[1]) && !Double.isInfinite(actualPosition[1])
                && !Double.isNaN(actualPosition[2]) && !Double.isInfinite(actualPosition[2])
            boolean exactMatch = expectedIsFinite
                && Double.compare(expectedPosition[0], actualPosition[0]) == 0
                && Double.compare(expectedPosition[1], actualPosition[1]) == 0
                && Double.compare(expectedPosition[2], actualPosition[2]) == 0
            boolean withinTolerance = tolerance > 0.0D && expectedIsFinite && actualIsFinite
                && Math.abs(expectedPosition[0] - actualPosition[0]) <= tolerance
                && Math.abs(expectedPosition[1] - actualPosition[1]) <= tolerance
                && Math.abs(expectedPosition[2] - actualPosition[2]) <= tolerance
            if (!exactMatch && !withinTolerance) {
                throw new GradleException(String.format(Locale.ROOT,
                    'TAS comparison FAILED runId=%s version=%s tick=%d expected=(%.17g, %.17g, %.17g) actual=(%.17g, %.17g, %.17g); %s',
                    runId, version, tick, expectedPosition[0], expectedPosition[1], expectedPosition[2],
                    actualPosition[0], actualPosition[1], actualPosition[2], snapshotContext()))
            }
        }
        if (expectedCount != actualCount) {
            String countMismatch = expectedCount > actualCount
                ? "expected position ${expected.ticks[actualCount]} but actual recording ended after ${actualCount} ticks"
                : "expected recording ended after ${expectedCount} ticks but actual position was ${actual.ticks[expectedCount]}"
            throw new GradleException("TAS comparison FAILED runId=${runId} version=${version} tick=${sharedCount}: ${countMismatch}; ${snapshotContext()}")
        }
        String comparisonMode = tolerance == 0.0D ? 'exact' : "tolerance=${tolerance}"
        logger.lifecycle("TAS comparison PASSED runId=${runId} version=${version}: ${comparisonMode} positions matched for ${expectedCount} ticks (expected=${expectedFile.absolutePath}, actual=${actualFile.absolutePath})")
    }
}

tasks.register('runTasWorkflow') {
    group = 'minecraft'
    description = 'Replay one recording against the localhost parkour gym for a comma-separated list of client versions.'
    doLast {
        def firstProperty = { List<String> names ->
            for (String name : names) {
                def value = project.findProperty(name)
                if (value != null && !value.toString().trim().isEmpty()) {
                    return value.toString().trim()
                }
            }
            return null
        }
        def recordingValue = firstProperty(['tasRecording', 'recordingFile', 'recording'])
        def versionsValue = firstProperty(['tasVersions', 'clientVersions', 'minecraftVersions'])
        if (recordingValue == null) {
            throw new GradleException('runTasWorkflow needs -PtasRecording=<file.lprc> (or -PrecordingFile=...)')
        }
        if (versionsValue == null) {
            throw new GradleException('runTasWorkflow needs -PtasVersions=1.8.9,1.12.2,current')
        }
        File recordingFile = project.file(recordingValue)
        if (!recordingFile.isFile()) {
            throw new GradleException("Recording file does not exist: ${recordingFile}")
        }
        def recordingTickCount = { File recording ->
            java.io.RandomAccessFile data = new java.io.RandomAccessFile(recording, 'r')
            try {
                if (data.length() < 44L || data.readInt() != 0x4C505243 || data.readUnsignedShort() != 1) {
                    throw new GradleException("Invalid LPRC recording: ${recording}")
                }
                data.seek(40L)
                int count = data.readInt()
                if (count < 0 || data.length() != 44L + 34L * count) {
                    throw new GradleException("Invalid LPRC tick count or length: ${recording}")
                }
                return count
            } finally {
                data.close()
            }
        }
        int sourceTickCount = recordingTickCount(recordingFile)
        List<String> versions = versionsValue.split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
        if (versions.isEmpty()) {
            throw new GradleException('At least one Minecraft version is required in -PtasVersions')
        }

        File outputDirectory = project.file(firstProperty(['tasOutputDir', 'outputDir']) ?: 'tas-results')
        outputDirectory.mkdirs()
        String serverAddress = firstProperty(['tasServer', 'serverAddress']) ?: 'localhost:25565'
        String startGymValue = firstProperty(['tasStartGym', 'startGym'])
        boolean startGym = startGymValue == null
            || ['true', '1', 'yes'].contains(startGymValue.toLowerCase(Locale.ROOT))
        int serverPort = 25565
        int lastColon = serverAddress.lastIndexOf(':')
        if (lastColon > 0 && lastColon < serverAddress.length() - 1 && serverAddress.indexOf(':') == lastColon) {
            try {
                serverPort = Integer.parseInt(serverAddress.substring(lastColon + 1))
            } catch (NumberFormatException ignored) {
                throw new GradleException("Invalid parkour gym address: ${serverAddress}")
            }
        }
        String sourceStem = recordingFile.name.replaceFirst(/(?i)\.lprc$/, '')
        List<String> manifest = ['# Legacy Parkour TAS workflow results', "# recording=${recordingFile.absolutePath}", "# server=${serverAddress}", 'version\tresult']
        File manifestFile = new File(outputDirectory, "${sourceStem}-manifest.tsv")
        manifestFile.setText(manifest.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        Process gymProcess = null
        boolean ownsGym = false

        def portOpen = {
            try {
                Socket socket = new Socket()
                socket.connect(new InetSocketAddress('127.0.0.1', serverPort), 500)
                socket.close()
                return true
            } catch (IOException ignored) {
                return false
            }
        }
        def streamProcess = { Process process, String label ->
            Thread thread = new Thread({
                process.inputStream.eachLine { line -> logger.lifecycle("[${label}] ${line}") }
            }, "legacy-parkour-${label.replaceAll('[^A-Za-z0-9_-]', '_')}")
            thread.daemon = true
            thread.start()
            return thread
        }

        try {
            if (!portOpen() && startGym) {
                File wrapper = project.file('gradlew.bat')
                List<String> serverCommand = [wrapper.absolutePath, 'runParkourGymServer', '--no-daemon']
                if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                    serverCommand = ['cmd', '/c'] + serverCommand
                }
                logger.lifecycle('Starting the localhost parkour gym server...')
                gymProcess = new ProcessBuilder(serverCommand)
                    .directory(project.rootDir)
                    .redirectErrorStream(true)
                    .start()
                ownsGym = true
                streamProcess(gymProcess, 'gym')
                long deadline = System.currentTimeMillis() + 180000L
                while (!portOpen() && System.currentTimeMillis() < deadline) {
                    Thread.sleep(1000L)
                    if (!gymProcess.isAlive()) {
                        throw new GradleException("Parkour gym server exited with code ${gymProcess.exitValue()}")
                    }
                }
            }
            if (!portOpen()) {
                throw new GradleException("Parkour gym is not listening at ${serverAddress}; start runParkourGymServer or pass -PtasStartGym=true")
            }

            File clientWrapper = project.file('gradlew.bat')
            for (String version : versions) {
                String safeVersion = version.replaceAll('[^A-Za-z0-9._-]', '_')
                File result = new File(outputDirectory, "${sourceStem}-${safeVersion}.lprc")
                File temporaryResult = new File(outputDirectory, result.name + '.tmp')
                if (temporaryResult.exists() && !temporaryResult.delete()) {
                    throw new GradleException("Cannot remove stale temporary result ${temporaryResult}")
                }
                Map<String, String> environment = new HashMap<String, String>(System.getenv())
                environment.put('LEGACY_PARKOUR_TAS_RECORDING', recordingFile.absolutePath)
                environment.put('LEGACY_PARKOUR_TAS_OUTPUT', temporaryResult.absolutePath)
                environment.put('LEGACY_PARKOUR_TAS_SERVER', serverAddress)
                environment.put('LEGACY_PARKOUR_TAS_RUN', "${sourceStem}-${safeVersion}")
                environment.put('LEGACY_PARKOUR_TAS_VERSION', version)
                environment.put('LEGACY_PARKOUR_TAS_COMPARE', 'false')
                List<String> clientCommand = [
                    clientWrapper.absolutePath,
                    'runTasClient',
                    '--no-daemon',
                    '--project-prop', "clientVersion=${version}",
                    '--project-prop', "tasRecording=${recordingFile.absolutePath}",
                    '--project-prop', "tasOutput=${temporaryResult.absolutePath}",
                    '--project-prop', "tasServer=${serverAddress}",
                    '--project-prop', "tasRun=${sourceStem}-${safeVersion}",
                    '--project-prop', "tasVersion=${version}"
                ]
                if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                    clientCommand = ['cmd', '/c'] + clientCommand
                }
                clientCommand = clientCommand.collect { it.toString() }
                logger.lifecycle("Running TAS client ${version}; result=${result.name}")
                ProcessBuilder clientBuilder = new ProcessBuilder(clientCommand)
                    .directory(project.rootDir)
                    .redirectErrorStream(true)
                environment.each { key, value -> clientBuilder.environment().put(key.toString(), value.toString()) }
                Process client = clientBuilder.start()
                Thread clientOutput = streamProcess(client, "tas-${safeVersion}")
                int exitCode = client.waitFor()
                clientOutput.join(5000L)
                if (exitCode != 0) {
                    throw new GradleException("TAS client ${version} exited with code ${exitCode}; no result was published")
                }
                if (!temporaryResult.isFile() || temporaryResult.length() == 0L) {
                    throw new GradleException("TAS client ${version} finished without a result file: ${temporaryResult}")
                }
                int resultTickCount = recordingTickCount(temporaryResult)
                if (resultTickCount != sourceTickCount) {
                    throw new GradleException("TAS client ${version} captured ${resultTickCount} of ${sourceTickCount} ticks; no result was published")
                }
                java.io.RandomAccessFile sourceData = new java.io.RandomAccessFile(recordingFile, 'r')
                java.io.RandomAccessFile resultData = new java.io.RandomAccessFile(temporaryResult, 'r')
                try {
                    byte[] sourceHeader = new byte[44]
                    byte[] resultHeader = new byte[44]
                    sourceData.readFully(sourceHeader)
                    resultData.readFully(resultHeader)
                    if (!java.util.Arrays.equals(sourceHeader, resultHeader)) {
                        throw new GradleException("TAS client ${version} changed the source start pose or format; no result was published")
                    }
                    byte[] sourceInput = new byte[10]
                    byte[] resultInput = new byte[10]
                    for (int tick = 0; tick < sourceTickCount; tick++) {
                        sourceData.readFully(sourceInput)
                        resultData.readFully(resultInput)
                        if (!java.util.Arrays.equals(sourceInput, resultInput)) {
                            throw new GradleException("TAS client ${version} changed buttons or facing at tick ${tick}; no result was published")
                        }
                        sourceData.skipBytes(24)
                        resultData.skipBytes(24)
                    }
                } finally {
                    sourceData.close()
                    resultData.close()
                }
                try {
                    java.nio.file.Files.move(
                        temporaryResult.toPath(),
                        result.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE
                    )
                } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                    java.nio.file.Files.move(
                        temporaryResult.toPath(),
                        result.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                    )
                }
                manifest << "${version}\t${result.absolutePath}"
                manifestFile.setText(manifest.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            }
            logger.lifecycle("TAS workflow complete. Results are listed in ${manifestFile}")
        } finally {
            if (ownsGym && gymProcess != null) {
                // On Windows, terminating cmd.exe leaves Gradle's Paper child running
                // and holding the Gym world lock. Capture the process tree first.
                List<ProcessHandle> children = gymProcess.toHandle().descendants()
                    .collect(java.util.stream.Collectors.toList())
                children.reverseEach { child ->
                    if (child.isAlive()) child.destroy()
                }
                if (gymProcess.isAlive()) gymProcess.destroy()
                Thread.sleep(2000L)
                children.reverseEach { child ->
                    if (child.isAlive()) child.destroyForcibly()
                }
                if (gymProcess.isAlive()) gymProcess.destroyForcibly()
            }
        }
    }
}

tasks.register('runParkourGymServer') {
    group = 'minecraft'
    description = 'Launch the parkour gym Paper server and keep it running.'
    dependsOn ':parkourgym-server:runServer'
}

tasks.register('decompileMinecraft', DecompileMinecraftTask) {
    group = 'minecraft'
    description = 'Decompile Minecraft client sources into decompiled_minecraft/<version>. ' +
            'Defaults to latest, 1.8.9, 1.12.2, and 1.14.4. ' +
            'Pass --versions=1.16.5,1.20.1 or -Pversions=1.8 to decompile other versions. ' +
            'Uses official Mojang mappings when they exist, otherwise Yarn or Ornithe Feather. ' +
            'Runs Vineflower on Java 25.'

    versions.convention(
            providers.gradleProperty('versions')
                    .orElse(providers.gradleProperty('minecraftVersions'))
                    .map { value -> MinecraftDecompileMain.splitVersions(value) }
                    .orElse(['latest', '1.8.9', '1.12.2', '1.14.4'])
    )
    outputRoot.convention(layout.projectDirectory.dir('decompiled_minecraft'))
    cacheDirectory.convention(layout.buildDirectory.dir('minecraft-decompile-cache'))
    decompilerClasspath.from(configurations.decompileRuntime)
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
