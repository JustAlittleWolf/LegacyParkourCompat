def rootTasAutomationValue = { String propertyName, String environmentName ->
    def propertyValue = findProperty(propertyName)
    if (propertyValue != null && !propertyValue.toString().trim().isEmpty()) {
        return propertyValue.toString().trim()
    }
    def environmentValue = System.getenv(environmentName)
    return environmentValue == null || environmentValue.trim().isEmpty() ? null : environmentValue.trim()
}
def rootTasAutomationArgs = []
def tasCompareTaskRequested = gradle.startParameter.taskNames.any { it.endsWith('runTasCompare') }
def rootTasAutomationExpected = rootTasAutomationValue('tasExpected', 'LEGACY_PARKOUR_TAS_EXPECTED')
def rootTasAutomationRecording = rootTasAutomationValue('tasRecording', 'LEGACY_PARKOUR_TAS_RECORDING')
def rootTasAutomationOutput = rootTasAutomationValue('tasOutput', 'LEGACY_PARKOUR_TAS_OUTPUT')
def rootTasAutomationServer = rootTasAutomationValue('tasServer', 'LEGACY_PARKOUR_TAS_SERVER')
def rootTasAutomationRun = rootTasAutomationValue('tasRun', 'LEGACY_PARKOUR_TAS_RUN')
def rootTasAutomationVersion = rootTasAutomationValue('tasVersion', 'LEGACY_PARKOUR_TAS_VERSION')
def rootTasAutomationCompare = rootTasAutomationValue('tasCompare', 'LEGACY_PARKOUR_TAS_COMPARE')
def rootTasAutomationTolerance = rootTasAutomationValue('tasTolerance', 'LEGACY_PARKOUR_TAS_TOLERANCE')
def rootTasAutomationMaxUlps = rootTasAutomationValue('tasMaxUlps', 'LEGACY_PARKOUR_TAS_MAX_ULPS')
def rootTasWorker = (findProperty('tasWorker') ?: 'false').toString().toBoolean()
if (tasCompareTaskRequested) {
    if (rootTasAutomationExpected == null) {
        throw new GradleException('runTasCompare needs -PtasExpected=<version-reference.lprc>')
    }
    if (rootTasAutomationVersion == null) {
        throw new GradleException('runTasCompare needs -PtasVersion=<parkour-version>, for example 1.12')
    }
    if (rootTasAutomationCompare == null || !['true', '1', 'yes'].contains(rootTasAutomationCompare.toLowerCase(Locale.ROOT))) {
        throw new GradleException('runTasCompare needs -PtasCompare=true')
    }
    if (rootTasAutomationTolerance != null) {
        try {
            double tolerance = Double.parseDouble(rootTasAutomationTolerance)
            if (Double.isNaN(tolerance) || Double.isInfinite(tolerance) || tolerance < 0.0D) {
                throw new NumberFormatException('not finite and non-negative')
            }
        } catch (NumberFormatException exception) {
            throw new GradleException("Invalid -PtasTolerance=${rootTasAutomationTolerance}; expected a finite non-negative number", exception)
        }
    }
    if (rootTasAutomationMaxUlps != null) {
        try {
            long maxUlps = Long.parseLong(rootTasAutomationMaxUlps)
            if (maxUlps < 0L) throw new NumberFormatException('negative')
        } catch (NumberFormatException exception) {
            throw new GradleException("Invalid -PtasMaxUlps=${rootTasAutomationMaxUlps}; expected a non-negative integer", exception)
        }
        if (rootTasAutomationTolerance != null) {
            throw new GradleException('tasMaxUlps and tasTolerance are mutually exclusive')
        }
    }

    File expectedReference = file(rootTasAutomationExpected)
    String runToken = UUID.randomUUID().toString().replace('-', '').substring(0, 10)
    String safeVersion = rootTasAutomationVersion.replaceAll('[^A-Za-z0-9._-]', '_')
    String expectedStem = expectedReference.name.replaceFirst(/(?i)\.lprc$/, '')
    rootTasAutomationRecording = expectedReference.absolutePath
    if (rootTasAutomationOutput == null) {
        rootTasAutomationOutput = new File(expectedReference.parentFile,
            "${expectedStem}-actual-${safeVersion}-${runToken}.lprc").path
    }
    if (rootTasAutomationRun == null) {
        rootTasAutomationRun = "compare-${safeVersion}-${runToken}"
    }
    rootTasAutomationRun = rootTasAutomationRun.replaceAll('[^A-Za-z0-9._:+/@-]', '_')
    if (rootTasAutomationRun.isEmpty()) {
        rootTasAutomationRun = "compare-${runToken}"
    }
    if (rootTasAutomationRun.length() > 36) {
        rootTasAutomationRun = rootTasAutomationRun.substring(0, 36)
    }
}
