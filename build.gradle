def tasLabJson = new groovy.json.JsonSlurper()
def tasLabApi = { String path, String method, Object body = null ->
    HttpURLConnection connection = (HttpURLConnection) new URL("http://127.0.0.1:25568${path}").openConnection()
    connection.connectTimeout = 2000
    connection.readTimeout = 3000
    connection.requestMethod = method
    if (body != null) {
        connection.doOutput = true
        connection.setRequestProperty('Content-Type', 'application/json')
        connection.outputStream.withCloseable { stream -> stream.write(groovy.json.JsonOutput.toJson(body).getBytes('UTF-8')) }
    }
    int status = connection.responseCode
    String response = (status < 400 ? connection.inputStream : connection.errorStream).getText('UTF-8')
    connection.disconnect()
    if (status >= 400) throw new GradleException("TAS lab HTTP ${status}: ${response}")
    return tasLabJson.parseText(response)
}
def ensureTasLab = {
    try { tasLabApi('/api/clients', 'GET'); return }
    catch (Exception ignored) { }
    File log = file('testing/run/logs/coordinator.log')
    log.parentFile.mkdirs()
    List<String> command = [file('gradlew.bat').absolutePath, ':testing:runLab', '--no-daemon']
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) command = ['cmd', '/c'] + command
    ProcessBuilder builder = new ProcessBuilder(command)
        .directory(rootDir).redirectErrorStream(true).redirectOutput(log)
    builder.environment().put('GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath)
    Process lab = builder.start()
    logger.lifecycle("Starting persistent TAS lab; log=${log.absolutePath}")
    long deadline = System.currentTimeMillis() + 180000L
    while (System.currentTimeMillis() < deadline) {
        try { tasLabApi('/api/clients', 'GET'); return }
        catch (Exception ignored) { }
        if (!lab.isAlive()) throw new GradleException("TAS lab exited with ${lab.exitValue()}; inspect ${log.absolutePath}")
        Thread.sleep(1000L)
    }
    throw new GradleException("TAS lab did not start; inspect ${log.absolutePath}")
}
def awaitTasLabRun = { String runId ->
    long deadline = System.currentTimeMillis() + 1200000L
    while (System.currentTimeMillis() < deadline) {
        def state = tasLabApi("/api/runs/${runId}", 'GET')
        if (state.state in ['success', 'after_failure', 'error']) {
            if (state.state == 'error') throw new GradleException("TAS lab run ${runId} failed: ${state}")
            return state
        }
        Thread.sleep(500L)
    }
    throw new GradleException("TAS lab run ${runId} timed out; inspect http://127.0.0.1:25568/api/runs/${runId}")
}

tasks.register('runTasCompare') {
    group = 'minecraft'
    description = 'Compare a reference against Legacy Parkour emulation and fail on any positional difference.'
    doFirst {
        ensureTasLab()
        Map<String, Object> request = [
            clientVersion: 'current', recording: file(rootTasAutomationExpected).absolutePath,
            output: file(rootTasAutomationOutput).absolutePath, profile: rootTasAutomationVersion, compare: true
        ]
        if (rootTasAutomationMaxUlps != null) request.maxUlps = Long.parseLong(rootTasAutomationMaxUlps)
        if (rootTasAutomationTolerance != null) request.tolerance = Double.parseDouble(rootTasAutomationTolerance)
        def accepted = tasLabApi('/api/runs', 'POST', request)
        logger.lifecycle("Queued TAS comparison ${accepted.runId} on the reusable current client")
        awaitTasLabRun(accepted.runId.toString())
    }
    doLast {
        File expectedFile = file(rootTasAutomationExpected)
        File actualFile = file(rootTasAutomationOutput)
        String runId = rootTasAutomationRun
        String version = rootTasAutomationVersion
        double tolerance = rootTasAutomationTolerance == null ? 0.0D : Double.parseDouble(rootTasAutomationTolerance)
        Long maxUlps = rootTasAutomationMaxUlps == null ? null : Long.valueOf(rootTasAutomationMaxUlps)
        def ulpDistance = { firstValue, secondValue ->
            double first = firstValue.doubleValue()
            double second = secondValue.doubleValue()
            if (!Double.isFinite(first) || !Double.isFinite(second)) return null
            long firstBits = Double.doubleToRawLongBits(first)
            long secondBits = Double.doubleToRawLongBits(second)
            BigInteger firstMagnitude = BigInteger.valueOf(firstBits & Long.MAX_VALUE)
            BigInteger secondMagnitude = BigInteger.valueOf(secondBits & Long.MAX_VALUE)
            return (firstBits < 0L) == (secondBits < 0L)
                ? firstMagnitude.subtract(secondMagnitude).abs()
                : firstMagnitude.add(secondMagnitude)
        }
        List<BigInteger> maximumUlps = [BigInteger.ZERO, BigInteger.ZERO, BigInteger.ZERO]
        File snapshotLog = file('parkourgym-server/run/logs/latest.log')

        def snapshotContext = {
            String logPath = snapshotLog.absolutePath
            if (snapshotLog.isFile()) {
                List<Integer> matchingLineNumbers = []
                snapshotLog.eachLine('UTF-8') { line, lineNumber ->
                    if (line.contains('[LPC_FAILURE_SNAPSHOT]') && line.contains('"runId":"' + runId + '"')) {
                        matchingLineNumbers << lineNumber
                    }
                }
                if (!matchingLineNumbers.isEmpty()) {
                    return "Snapshots: ${matchingLineNumbers.collect { line -> "${logPath}:${line}" }.join(', ')} [LPC_FAILURE_SNAPSHOT] runId=${runId}"
                }
            }
            return "Snapshot log: ${logPath}; search for [LPC_FAILURE_SNAPSHOT] and runId=${runId}"
        }
        def readPositions = { File source, String label ->
            if (!source.isFile() || source.length() == 0L) {
                throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording is missing or empty: ${source.absolutePath}; ${snapshotContext()}")
            }
            java.io.DataInputStream data = null
            try {
                data = new java.io.DataInputStream(new java.io.BufferedInputStream(new java.io.FileInputStream(source)))
                if (data.readInt() != 0x4C505243) {
                    throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording has invalid LPRC magic: ${source.absolutePath}; ${snapshotContext()}")
                }
                int formatVersion = data.readUnsignedShort()
                if (formatVersion != 1) {
                    throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording format ${formatVersion} is unsupported: ${source.absolutePath}; ${snapshotContext()}")
                }
                data.readUnsignedShort()
                double startX = data.readDouble()
                double startY = data.readDouble()
                double startZ = data.readDouble()
                data.readFloat()
                data.readFloat()
                int count = data.readInt()
                if (count < 0 || source.length() != 44L + (34L * count)) {
                    throw new GradleException("TAS comparison failed for runId=${runId}: ${label} recording has an invalid tick count or truncated data: ${source.absolutePath}; ${snapshotContext()}")
                }
                List<List<Double>> positions = new ArrayList<List<Double>>(count)
                for (int tick = 0; tick < count; tick++) {
                    data.readUnsignedShort()
                    data.readFloat()
                    data.readFloat()
                    positions.add([Double.valueOf(data.readDouble()), Double.valueOf(data.readDouble()), Double.valueOf(data.readDouble())])
                }
                return [start: [Double.valueOf(startX), Double.valueOf(startY), Double.valueOf(startZ)], ticks: positions]
            } catch (java.io.IOException exception) {
                throw new GradleException("TAS comparison failed for runId=${runId}: could not read ${label} recording ${source.absolutePath}: ${exception.message}; ${snapshotContext()}", exception)
            } finally {
                if (data != null) {
                    data.close()
                }
            }
        }

        def expected = readPositions(expectedFile, 'expected')
        def actual = readPositions(actualFile, 'actual')
        int expectedCount = expected.ticks.size()
        int actualCount = actual.ticks.size()
        int sharedCount = Math.min(expectedCount, actualCount)
        for (int tick = 0; tick < sharedCount; tick++) {
            List<Double> expectedPosition = expected.ticks[tick]
            List<Double> actualPosition = actual.ticks[tick]
            boolean expectedIsFinite = !Double.isNaN(expectedPosition[0]) && !Double.isInfinite(expectedPosition[0])
                && !Double.isNaN(expectedPosition[1]) && !Double.isInfinite(expectedPosition[1])
                && !Double.isNaN(expectedPosition[2]) && !Double.isInfinite(expectedPosition[2])
            boolean actualIsFinite = !Double.isNaN(actualPosition[0]) && !Double.isInfinite(actualPosition[0])
                && !Double.isNaN(actualPosition[1]) && !Double.isInfinite(actualPosition[1])
                && !Double.isNaN(actualPosition[2]) && !Double.isInfinite(actualPosition[2])
            boolean exactMatch = expectedIsFinite && actualIsFinite
                && Double.compare(expectedPosition[0], actualPosition[0]) == 0
                && Double.compare(expectedPosition[1], actualPosition[1]) == 0
                && Double.compare(expectedPosition[2], actualPosition[2]) == 0
            boolean withinTolerance = tolerance > 0.0D && expectedIsFinite && actualIsFinite
                && Math.abs(expectedPosition[0] - actualPosition[0]) <= tolerance
                && Math.abs(expectedPosition[1] - actualPosition[1]) <= tolerance
                && Math.abs(expectedPosition[2] - actualPosition[2]) <= tolerance
            List<BigInteger> distances = expectedIsFinite && actualIsFinite
                ? (0..2).collect { axis -> ulpDistance(expectedPosition[axis], actualPosition[axis]) }
                : null
            if (distances != null) {
                (0..2).each { axis ->
                    if (distances[axis] > maximumUlps[axis]) maximumUlps[axis] = distances[axis]
                }
            }
            boolean withinUlps = maxUlps != null && distances != null
                && distances.every { distance -> distance <= BigInteger.valueOf(maxUlps) }
            if (!exactMatch && !withinTolerance && !withinUlps) {
                throw new GradleException(String.format(Locale.ROOT,
                    'TAS comparison FAILED runId=%s version=%s tick=%d expected=(%.17g, %.17g, %.17g) actual=(%.17g, %.17g, %.17g) ulpXYZ=(%s, %s, %s) maxUlpXYZ=(%s, %s, %s); %s',
                    runId, version, tick, expectedPosition[0], expectedPosition[1], expectedPosition[2],
                    actualPosition[0], actualPosition[1], actualPosition[2], distances == null ? 'nonfinite' : distances[0],
                    distances == null ? 'nonfinite' : distances[1], distances == null ? 'nonfinite' : distances[2],
                    maximumUlps[0], maximumUlps[1], maximumUlps[2], snapshotContext()))
            }
        }
        if (expectedCount != actualCount) {
            String countMismatch = expectedCount > actualCount
                ? "expected position ${expected.ticks[actualCount]} but actual recording ended after ${actualCount} ticks"
                : "expected recording ended after ${expectedCount} ticks but actual position was ${actual.ticks[expectedCount]}"
            throw new GradleException("TAS comparison FAILED runId=${runId} version=${version} tick=${sharedCount}: ${countMismatch}; ${snapshotContext()}")
        }
        String comparisonMode = maxUlps != null ? "maxUlps=${maxUlps}, maxUlpXYZ=${maximumUlps}"
            : tolerance == 0.0D ? 'exact' : "tolerance=${tolerance}"
        logger.lifecycle("TAS comparison PASSED runId=${runId} version=${version}: ${comparisonMode} positions matched for ${expectedCount} ticks (expected=${expectedFile.absolutePath}, actual=${actualFile.absolutePath})")
    }
}

tasks.register('runTasWorkflow') {
    group = 'minecraft'
    description = 'Queue a recording for multiple Minecraft versions on reusable TAS clients.'
    doLast {
        String recordingValue = (findProperty('tasRecording') ?: findProperty('recordingFile') ?: findProperty('recording'))?.toString()
        String versionsValue = (findProperty('tasVersions') ?: findProperty('clientVersions') ?: findProperty('minecraftVersions'))?.toString()
        if (!recordingValue || !versionsValue) {
            throw new GradleException('runTasWorkflow needs -PtasRecording=<file.lprc> and -PtasVersions=1.8.9,1.12.2,current')
        }
        File source = file(recordingValue)
        if (!source.isFile()) throw new GradleException("Recording file does not exist: ${source}")
        def tickCount = { File recording ->
            java.io.RandomAccessFile data = new java.io.RandomAccessFile(recording, 'r')
            try {
                if (data.length() < 44L || data.readInt() != 0x4C505243 || data.readUnsignedShort() != 1) {
                    throw new GradleException("Invalid LPRC recording: ${recording}")
                }
                data.seek(40L)
                int count = data.readInt()
                if (count < 0 || data.length() != 44L + 34L * count) {
                    throw new GradleException("Invalid LPRC tick count or length: ${recording}")
                }
                return count
            } finally { data.close() }
        }
        int expectedTicks = tickCount(source)
        def verifyInputs = { File result ->
            if (tickCount(result) != expectedTicks) throw new GradleException("TAS run captured the wrong tick count: ${result}")
            java.io.RandomAccessFile expected = new java.io.RandomAccessFile(source, 'r')
            java.io.RandomAccessFile actual = new java.io.RandomAccessFile(result, 'r')
            try {
                byte[] expectedHeader = new byte[44]
                byte[] actualHeader = new byte[44]
                expected.readFully(expectedHeader)
                actual.readFully(actualHeader)
                if (!java.util.Arrays.equals(expectedHeader, actualHeader)) {
                    throw new GradleException("TAS run changed the source start pose or format: ${result}")
                }
                byte[] expectedInput = new byte[10]
                byte[] actualInput = new byte[10]
                for (int tick = 0; tick < expectedTicks; tick++) {
                    expected.readFully(expectedInput)
                    actual.readFully(actualInput)
                    if (!java.util.Arrays.equals(expectedInput, actualInput)) {
                        throw new GradleException("TAS run changed input or facing at tick ${tick}: ${result}")
                    }
                    expected.skipBytes(24)
                    actual.skipBytes(24)
                }
            } finally { expected.close(); actual.close() }
        }
        List<String> versions = versionsValue.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
        if (versions.isEmpty()) throw new GradleException('At least one client version is required')
        File outputDirectory = file((findProperty('tasOutputDir') ?: findProperty('outputDir') ?: 'tas-results').toString())
        outputDirectory.mkdirs()
        ensureTasLab()
        String stem = source.name.replaceFirst(/(?i)\.lprc$/, '')
        File manifestFile = new File(outputDirectory, "${stem}-manifest.tsv")
        List<String> manifest = ['# Legacy Parkour TAS workflow results', "# recording=${source.absolutePath}", 'version\tresult']
        List<Map<String, Object>> submitted = []
        versions.each { version ->
            String safe = version.replaceAll('[^A-Za-z0-9._-]', '_')
            File result = new File(outputDirectory, "${stem}-${safe}-${UUID.randomUUID().toString().substring(0, 8)}.lprc")
            def accepted = tasLabApi('/api/runs', 'POST', [
                clientVersion: version, recording: source.absolutePath, output: result.absolutePath, compare: false
            ])
            submitted << [version: version, output: result, runId: accepted.runId.toString()]
            logger.lifecycle("Queued TAS ${version}: ${accepted.runId}")
        }
        submitted.each { entry ->
            awaitTasLabRun(entry.runId.toString())
            File result = (File) entry.output
            if (!result.isFile() || result.length() == 0L) {
                throw new GradleException("TAS run ${entry.runId} produced no result: ${result}")
            }
            verifyInputs(result)
            manifest << "${entry.version}\t${result.absolutePath}"
            manifestFile.setText(manifest.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
        logger.lifecycle("TAS workflow complete: ${manifestFile.absolutePath}")
    }
}

tasks.register('runParkourGymServer') {
    group = 'minecraft'
    description = 'Launch the parkour gym Paper server and keep it running.'
    dependsOn ':parkourgym-server:runServer'
}

tasks.register('decompileMinecraft', DecompileMinecraftTask) {
    group = 'minecraft'
    description = 'Decompile Minecraft client sources into decompiled_minecraft/<version>/<mapping>. ' +
            'Defaults to latest, 1.8.9, 1.12.2, 1.13.2, and 1.14.4. ' +
            'Pass --versions=1.16.5,1.20.1 or -Pversions=1.8 to decompile other versions. ' +
            'Uses official Mojang mappings when they exist, otherwise Yarn or Ornithe Feather. ' +
            'Runs Vineflower on Java 25.'

    versions.convention(
            providers.gradleProperty('versions')
                    .orElse(providers.gradleProperty('minecraftVersions'))
                    .map { value -> MinecraftDecompileMain.splitVersions(value) }
                    .orElse(['latest', '1.8.9', '1.12.2', '1.13.2', '1.14.4'])
    )
    outputRoot.convention(layout.projectDirectory.dir('decompiled_minecraft'))
    mappings.convention(providers.gradleProperty('mappings')
            .map { value -> MinecraftDecompileMain.splitVersions(value) }
            .orElse(['auto']))
    decompilerHeap.convention(providers.gradleProperty('decompilerHeap').orElse('4G'))
    cacheDirectory.convention(layout.buildDirectory.dir('minecraft-decompile-cache'))
    decompilerClasspath.from(configurations.decompileRuntime)
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
